  - {workflow: WF-O02, step: S06, when: {step: S10, output: remaining_owner_causes, non_empty: true}, why: "fresh owner-only cause set excludes Q63 billing automatic clear; S11 separately verifies live closure"}
  - {workflow: WF-O02, step: S09, when: {step: S03, output: handback_triggers, non_empty: true}, why: "the human handback opens on every handback trigger (FR-GOV-10, P-150)"}
  - {workflow: WF-B04, step: S02, when: {step: S01, output: kind, in: [offer, landing_content]}, why: "CRO authors only offer/content requests"}
  - {workflow: WF-B04, step: S10, when: {step: S01, output: kind, in: [tracking]}, why: "tracking requests route only to the analyst author"}
  - {workflow: WF-B04, step: S11, when: {step: S01, output: kind, in: [landing_content]}, why: "the analyst reviews a CRO landing PR and never its own tracking PR; all kinds still require the independent Reviewer"}
  - {workflow: WF-B04, step: S05, when: {step: S04, output: cause, in: [offer_change]}, why: "amt-release publishes only the AMT config bundle of an offer change (P-46)"}
  - {workflow: WF-B02, step: S13, when: {step: S10, output: created_entity_ids, non_empty: true}, why: "activation proposals target only successfully proven created entities"}
  - {workflow: WF-B02, step: S14, when: {step: S10, output: created_entity_ids, non_empty: true}, why: "no activation review when no activation proposal exists"}
  - {workflow: WF-B02, step: S11, when: {step: S10, output: created_entity_ids, non_empty: true}, why: "no activation dispatch when creation produced no proven entity"}
  - {workflow: WF-B02, step: S07, when: {step: S10, output: created_entity_ids, non_empty: true}, why: "no activation approval when nothing was created"}
