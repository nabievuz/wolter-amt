lease:
  required: true
  fence_on_takeover: true
controller_epoch:
  required: true
  stale_epoch_dispatch: reject_and_audit
retry:
  only_steps_marked_retryable: true
  irreversible_effect: reconcile_before_new_attempt
  provider_exactly_once_assumed: false
handoff:
  receiver_validates: true
  assignment_or_mention_is_acceptance: false
  stale_artifact_publish: deny
paperclip:
  role: projection_and_task_surface
  issue_close_completes_step: false
  drift: run_truth_wins_issue_is_updated
owner_view:
  questions:
  - what_is_running
  - expected_result
  - who_needs_to_do_what
  - spent_so_far
  - next_step
  also_show:
  - blockers
  - waiting_until
  - decision_deadline
  - last_trusted_result
  surfaces:
  - ops_bot_status
  - paperclip_dashboard
bootstrap:
  first_business_dispatch_requires_runtime: true
  pre_runtime_test_issues: inventory_then_close_or_attach
retention_readiness_ref: privacy.retention
