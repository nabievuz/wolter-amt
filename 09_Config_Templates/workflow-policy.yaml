  - {workflow: WF-B04, step: S02, type: agent, ref: cro, why: "CRO owns offer/content proposals only; approval-policy landing_pr_paths limits content/**"}
  - {workflow: WF-B04, step: S10, type: agent, ref: funnel-analyst, why: "tracking/** PR author uses the existing analyst allowlist"}
  - {workflow: WF-B04, step: S11, type: agent, ref: funnel-analyst, why: "CRO content changes require a separate analyst tracking-impact review"}
  - {workflow: WF-B04, step: S12, type: agent, ref: reviewer, why: "every exact offer or landing PR revision has an independent Reviewer verdict"}
  - {workflow: WF-B04, step: S08, type: human, ref: owner, why: "the production Dokploy deploy needs production credentials, so it is an owner human step (Q46.4)"}
  - {workflow: WF-O04, step: S02, type: human, ref: owner, why: "HG-OPS-01 spending-limit update is owner-only (Q37)"}
  - {workflow: WF-B02, step: S12, type: agent, ref: reviewer, why: "creation command payload review is separate from the S04 creative verdict"}
  - {workflow: WF-B02, step: S13, type: agent, ref: media-buyer, why: "first activation needs a new command proposal after proven PAUSED creation"}
  - {workflow: WF-B02, step: S14, type: agent, ref: reviewer, why: "activation command review binds its own exact command payload"}
  - {workflow: WF-B03, step: S03, type: agent, ref: reviewer, why: "every review_required command is independently reviewed even without a creative dependency"}
  - {workflow: WF-B02, step: S05, type: human, ref: flag_holder, requires_flag: language_checker, why: "Q42 native-Uzbek language check"}
  - {workflow: WF-E01, step: S09, type: deterministic, ref: sync-worker, why: "upgrade observation needs release and guardrail data"}
  - {workflow: WF-E02, step: S08, type: deterministic, ref: sync-worker, why: "staged observation needs release data"}
  - {workflow: WF-E03, step: S06, type: deterministic, ref: sync-worker, why: "observation needs release data"}
  - {workflow: WF-E04, step: S06, type: deterministic, ref: sync-worker, why: "observation needs release data"}
  - {workflow: WF-O02, step: S07, type: deterministic, ref: sync-worker, why: "post-incident observation needs telemetry and business guards"}
  - {workflow: WF-O02, step: S10, type: deterministic, ref: amt-control, why: "fresh live cause routing with no owner billing task"}
  - {workflow: WF-O02, step: S11, type: deterministic, ref: amt-control, why: "deterministic exact cause-resolution barrier before observation"}
  - {workflow: WF-O02, step: S03, type: deterministic, ref: amt-control, unconditional: true, why: "containment is deterministic, immediate and never conditional (P-49)"}
required_conditions:
