# Project OS configuration template; unresolved readiness blocks the relevant live profile.
schema_version: 1
bundle_state: template
runtime_service: amt-workflow
truth_store: postgresql amt.workflow_* tables (WORKFLOW_RUNTIME §3)
mechanism_readiness_ref: workflow.mechanism
recovery_readiness_ref: workflow.recovery
definition_schema: schemas/workflow-definition.schema.json
external_participants:
  # actors outside the AMT host that definitions name as executor, starter, trigger source or producer (validator W08, W10)
  # executes_steps: true = may be the executor of a deterministic step; registry_ref = the canonical contract entry
  landing-intake: {host: "production Dokploy (go.wolter.uz)", owner: owner, role: "durable accept of a landing submission (ADR-012, TRACKING_CAPI)", executes_steps: true}
  landing-intake-delivery: {host: "production Dokploy (go.wolter.uz)", owner: owner, role: "CRM delivery and binding of an accepted submission", executes_steps: true}
  github-ci: {host: "GitHub Actions of the AMT offer-config and landing repositories", owner: owner, role: "pull request checks (WF-B04 S03)", executes_steps: true}
  independent-monitor: {host: "off-host monitor (ops.independent_monitor)", owner: technical_operator, role: "heartbeat ACK and host-down alert on the alternate channel", executes_steps: false, registry_ref: "runtime-isolation.yaml#external_dependencies[independent-monitor]"}
human_aliases:
  # composite human executors and principals; each resolves to registered roles or assignments (validator W08)
  # flag: from_executor = the step names the flag in executor.requires_flag; a fixed flag name = every performer holds it
  approver_per_policy:
    any_of: [owner, ads_approver]
    case_narrowing: "approval-policy.yaml#actions.<action>.cases: a matching case replaces the action's approvers and level (re_activation_after_protective_pause -> owner only, never_auto)"
    resolution: "approval-policy.yaml#actions.<action>.approvers per command (the gateway routes each command to its own approvers); owner-only actions stay owner-only (Q32)"
  flag_holder:
    any_of: [owner, ads_approver, sales_lead, fleet_operator, content_contributor, viewer]
    flag: from_executor
    applies_flag_exclusions: true
    resolution: "any person with a valid membership whose effective flags include executor.requires_flag (roles.yaml#flag_rules); the flag decides, not the role"
  snapshot_provider:
    any_of: [fleet_operator, sales_lead, finance_owner]
    resolution: "the provider of the readiness key in the WF-O01 run input: fleet snapshot fleet_operator, sale readiness sales_lead, finance sources finance_owner"
  ops_on_call:
    any_of: [technical_operator, owner, ads_approver, sales_lead, fleet_operator, content_contributor, viewer]
    flag: ops_responder
    resolution: "readiness ops.escalation routing: the technical_operator primary first, the named deputy after readiness:ops.ack_minutes"
  handback_custodian:
    any_of: [owner, ads_approver, sales_lead, fleet_operator, content_contributor, viewer]
    flag: ops_responder
    resolution: "the named custodian of the pipeline in readiness ops.ads_handback_roster or ops.sale_handback_roster (WF-O01 ACK-probed); the owner when the roster escalates"
  ops_deputy:
    any_of: [technical_operator, owner, ads_approver, sales_lead, fleet_operator, content_contributor, viewer]
    flag: ops_responder
    resolution: "the deputy named in readiness ops.escalation (F2_LIVE_INTAKE)"
catalog:
- WF-B01
- WF-B02
- WF-B03
- WF-B04
- WF-B05
- WF-B06
- WF-B07
- WF-O01
- WF-O02
- WF-O03
- WF-O04
- WF-O05
- WF-E01
- WF-E02
- WF-E03
- WF-E04
- WF-E05
schedule_execution:
  # what runs each operations.yaml#schedule entry and how a missed run becomes visible (validator T11)
  # workflow: the entry is a trigger, step or timer of that workflow (a late timer or a missing run is ALERT_WORKFLOW_BLOCKED);
  # job: a deterministic service writes one completion row per tick (schedule_runs); no row by the earlier of the next tick of
  # the same id and the end of the business day -> missed_run_alert; human: the person the job reminds or reports to;
  # a workflow entry with missed_run_alert: the scheduler raises it when the scheduled run or its mapped step does not start on time
  # (concurrency limit, precondition); protective entries (schedule_protective) need one and their workflow has no start freshness
  fleet_ask: {workflow: WF-O01, step: S01}
  media_buyer_daily: {workflow: WF-B03, step: S02}
  fleet_remind: {workflow: WF-O01, timer: fleet_reminder_09_00}
  rent_capacity_review: {workflow: WF-B03, step: S02}
  sale_ready: {workflow: WF-O01, step: S02}
  sale_ready_cutoff: {workflow: WF-O01, timer: sale_ready_cutoff_09_30}
  tracking_health: {job: sync-worker, missed_run_alert: ALERT_SCHEDULE_MISSED}
  batch_cutoff: {workflow: WF-B03, step: S04}
  change_set: {workflow: WF-B03, step: S04, timer: change_set_10_00}
  fleet_escalate: {workflow: WF-O01, timer: fleet_escalation_14_00}
  sales_digest: {job: ops-bot, missed_run_alert: ALERT_SCHEDULE_MISSED}
  exposure_guard: {job: sync-worker, missed_run_alert: ALERT_SCHEDULE_MISSED}
  kill_criteria: {workflow: WF-B06, step: S01, timer: mon_07_30, missed_run_alert: ALERT_KILL_CRITERIA}
  weekly_plan: {workflow: WF-B06, step: S05, timer: mon_11_00}
  content_reminder: {job: ops-bot, missed_run_alert: ALERT_SCHEDULE_MISSED}
  weekly_report_submit: {workflow: WF-B06, step: S02, timer: mon_08_00}
  weekly_report_review: {workflow: WF-B06, step: S03}
  weekly_report: {workflow: WF-B06, step: S04, timer: mon_09_00}
  cmo_status: {workflow: WF-B06, step: S09, timer: fri_16_00_status}
  dependency_check: {workflow: WF-E03, step: S01}
  backup: {job: amt-backup, missed_run_alert: ALERT_BACKUP_STALE}
  spend_cap_update: {workflow: WF-O04, step: S01, missed_run_alert: ALERT_WORKFLOW_BLOCKED}
  qualified_volume_check: {job: sync-worker, missed_run_alert: ALERT_SCHEDULE_MISSED}
  retro: {workflow: WF-O05, step: S01, missed_run_alert: ALERT_WORKFLOW_BLOCKED}
  credential_expiry_check: {job: ops-bot, human: technical_operator, missed_run_alert: ALERT_SCHEDULE_MISSED}
  restore_check: {workflow: WF-O03, timer: restore_check_due}
  kill_drill: {workflow: WF-O03, timer: full_drill_due}
schedule_protective: [tracking_health, exposure_guard, kill_criteria, backup]
flag_exclusions:
  # roles that may not perform a flag-gated step even when they hold the flag (validator W08)
  language_checker: {roles: [owner], until: "◇ P-29 (owner backup language checker) is accepted", why: "Q42 check by a native-Uzbek person other than the owner (RBAC flags table)"}
