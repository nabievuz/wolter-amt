# Project OS configuration template; unresolved readiness blocks the relevant live profile.
schema_version: 1
bundle_state: template
record_states:
- pending
- evidenced
- approved
- not_applicable
record_fields:
- key
- gate
- criticality
- accountable_role
- co_signers
- prepared_by
- description
- status
- value
- evidence_ref
- evidence_at
- evidence_prepared_by
- max_evidence_age
- approved_by
- approved_at
- co_signatures
- valid_until
rules:
  one_gate_per_key: each requirement names exactly one gate profile (the earliest); later profiles inherit it through profiles.requires
  fresher_evidence: a later gate that needs fuller or fresher evidence uses a separate key with max_evidence_age
  profile_pass: a profile PASSes at a gate when every requirement of the profile and of all inherited profiles is approved with evidence not older
    than max_evidence_age, or validly not_applicable
  gate_time: a gate is a raise of a capability (execution-policy.yaml#capability_enablement) - a release in which a config-gated capability first
    enters the manifest capabilities_enabled (amt-release evaluates the profile at prepare and again at activate), and the owner's raising
    transitions global_mode_change shadow -> enabled, pipeline_mode_change L0 -> L1 or L1 -> L2 and trust_graduation L1 -> L2 (amt-control
    evaluates when it consumes the typed code and binds profile_evaluation_digest); an L2 gate evaluates L2_ENABLE together with that pipeline's
    L1 profile (rent F6_STEP1, sale F6_STEP2); lowering transitions, routine releases of capabilities already enabled, maintenance_release,
    control_resume (also the return after a restore) and automatic protective transitions are not gates
  pass_persistence: a profile that passed a gate stays PASS for the capability it opened (gate_result in the release manifest readiness_snapshot or
    in control_events); between gates its use is blocked only by operational_validity, and max_evidence_age is applied again only at the next gate
  operational_validity: on every capability, mode and trust check amt-control requires, for each key of the capability's profile, an effective
    approval that stands - for a live key the latest approved or not_applicable revision, for a bundle-bound key the revision pinned in the active
    release snapshot - that no withdrawal has suspended and, for a live key, whose valid_until (recorded with the evidence when the evidence itself
    expires) has not passed; a newer approved revision of a bundle-bound key takes effect when a release pins it, and a later evidenced revision (a
    refresh) never suspends an approval; bundle-bound keys carry no valid_until - item expiry inside their value (for example a credential or asset
    expires_at) is enforced by the consuming service
  freshness_keys: a key with max_evidence_age is a freshness key and a live key - never bundle-bound, even when a config template references it (the
    reference requires the check, it does not consume a value), so a refreshed approval replaces the previous one without a release
  signing_freshness: an approve or cosign signature is refused when its evidence is older than max_evidence_age at signing
  withdraw: /readiness withdraw <key> <reason> by the owner (any key) or the key's accountable role holder targets one revision and writes a valueless
    pending revision with the reason; withdrawing the effective approval suspends it, withdrawing a newer revision that is not yet pinned voids only
    that revision and leaves the pinned approval in force; withdraw is exempt from the preparer and freshness checks
  agent_preparers: an agent may be prepared_by only for a key whose gate profile inherits F4_AGENTS (agents.run); earlier keys are prepared by the
    builder; readiness_evidence refuses an evidence_prepared_by that is neither the key's prepared_by nor builder
  not_applicable: only criticality optional, with rationale and owner sign-off
  approver: approved_by is a person reference (person:<id>) holding accountable_role at approved_at - RBAC roles (owner, sales_lead, fleet_operator)
    from amt.roles, responsibility roles (technical_operator, finance_owner, privacy_owner, independent_reviewer) from amt.responsibility_assignments,
    verified by amt-control - and is not evidence_prepared_by; every co_signer role has a co_signatures entry {role, person, at}; signatures are
    made with /readiness approve|cosign (typed code, approval-policy action readiness_signoff); withdrawal follows the withdraw rule
  storage: runtime records live in amt.readiness_records and amt.readiness_signatures (DATA_MODEL section 8), written only by amt-control - evidence through
    the control op readiness_evidence (amt-workflow for workflow outputs, amt-release for evidence manifests in merged main commits), signatures through
    readiness_sign (amt-ops after the typed code); status takes only record_states values; this file is the template and the export format
  agents_and_builder: appear only as prepared_by; never approve
  runtime_binding: execution-policy.yaml#capability_requires_profile; amt-release writes a readiness_snapshot into the release manifest (per key the
    effective approval revision and value_hash it pins, per capability the gate result) and refuses to enable a capability whose profile does not
    pass its gate; keys referenced by config templates (readiness_ref fields) are bundle-bound except freshness keys; to pin a newly approved
    bundle-bound value amt-release may build a readiness-only candidate from the active commit; amt-control re-evaluates on every capability
    check (operational_validity)
  readiness_is_bounded: a readiness value works only inside owner decisions, invariants and contracts; it can never replace an owner-set control
  approved_record: approved needs a non-null value, evidence_ref, evidence_at <= approved_at <= now, and evidence not older than max_evidence_age at
    approved_at
  never_not_applicable: critical keys are never not_applicable; auto_release.decision_ref and evolution.fe_acceptance are critical so AUTO_RELEASE_ENABLE
    cannot pass while auto-release stays undecided
  value_constraints:   # an approvable value that is refused while a profile condition holds (OPEN_ITEMS section 4); profile evaluation fails on it
  - key: engineering.independent_reviewer
    value: class_e_frozen
    refused_while: {profile: F5_GO, closure_contains: FE_RELEASE}   # P-11 retained; Q67 additionally requires FE_RELEASE before formal F5 entry
    conflict: C-28
    reason: Q67 requires FE_RELEASE and its human baseline signoff before formal F5 eval and real shadow; with FE_RELEASE in closure(F5_GO) every config release (evolution-policy config_coverage_rule) and the HG-F6-06 secret-rotation release
      (release-policy release_approval.applies_to) are class E; class_e_frozen refuses class E until F7, so the HG-F5-04 protected config change and
      the HG-F6-06 rotation could never be released and F6_STEP1 would be unreachable
    until: a new explicit owner decision supersedes Q67 and the protected class E rules; OD-01 is closed, and class_e_frozen remains refused
  - key: business.exposure   # P-57: a numeric bound, checked on the approved value
    field: bad_week_streak
    max: 2   # kill-criteria.yaml rules KC-01 consecutive_weeks (✅ Q31)
    conflict: C-29
    reason: the exposure bad-week streak counts the KC streak and must hand back no later than KC-01 triggers
  phase_entry_profiles:
    F5:
      decision_ref: Q67
      requires_profiles: [FE_RELEASE]
      before: [formal_eval, real_shadow]
      missing_or_failed: blocked
  approvable_values:   # P-57: values a key may be approved with, as data; R20 checks constraints against this list
    engineering.independent_reviewer: [person_ref, class_e_frozen]   # OD-12 options (a)/(b) person_ref, (c) class_e_frozen
accountable_roles:
- owner
- sales_lead
- fleet_operator
- technical_operator
- finance_owner
- privacy_owner
- independent_reviewer
preparers:
- builder
- amt-workflow   # deterministic gate evidence (WF-O01) once the builder has no production access (HG-F6-06)
- cmo
- media-buyer
- creative-studio
- cro
- funnel-analyst
- reviewer
- sales_lead
- fleet_operator
- technical_operator
profiles:
  F1_AUTH:
    requires: []
    description: Owner identity, tg-auth, break-glass, ops-bot transport
  F1_COST_RUNTIME:
    requires: []
    description: Billable LLM calls through llm-proxy with real reset/accounting window
  F1_ISOLATION:
    requires: []
    description: Pinned components and isolated role-runner prototype
  F1_WORKFLOW:
    requires: []
    description: Durable workflow runtime prototype (restart, timer, handoff, replay)
  F2_LIVE_INTAKE:
    requires:
    - F1_AUTH
    - F1_COST_RUNTIME
    - F1_ISOLATION
    - F1_WORKFLOW
    description: Real landing traffic with durable intake, consent, recovery and monitoring
  F2_TRACKING_PASS:
    requires:
    - F2_LIVE_INTAKE
    description: 'Tracking gate: 14 days report-only, approved thresholds, 7 consecutive PASS (HG-F2-08)'
  F3_CONTROLLED_TEST:
    requires:
    - F2_TRACKING_PASS
    description: Controlled Meta tests on owner-approved PAUSED entities after the tracking gate (Q37 - no write tool before F2 passes); no production write
  F4_AGENTS:
    requires:
    - F3_CONTROLLED_TEST
    description: Six agents run through gateway/proxy with real role isolation; all pipelines L0
  F4_CONTENT:
    requires:
    - F4_AGENTS
    description: Offers, asset rights and media bounds for creative publishing
  FE_SANDBOX:
    requires:
    - F1_ISOLATION
    - F1_WORKFLOW
    description: Engineering sandbox candidates without production credentials
  FE_RELEASE:
    requires:
    - FE_SANDBOX
    description: Complete manifest-bound verification, independent human baseline review and owner-approved release via amt-release; Q67 requires PASS before any formal F5 eval or real shadow
  F5_GO:
    requires:
    - F2_TRACKING_PASS
    - F4_CONTENT
    - FE_RELEASE
    description: Global readiness closure, evals and 7-day real shadow; FE_RELEASE must already PASS before formal eval or real shadow starts (Q67); HG-F5-02 go/no-go
  F6_STEP1:
    requires:
    - F5_GO
    description: Rent pipeline L1 for 14 days; sale stays with the targetologist
  F6_STEP2:
    requires:
    - F6_STEP1
    description: Sale L1 / full takeover after Step 1 evidence
  L2_ENABLE:
    requires:
    - F6_STEP1
    description: L2 for a specific action_type x pipeline after graduation (HG-L2-01)
  PRE_SCREEN:
    requires:
    - F5_GO
    description: Jev pre-screen before the Reviewer (Q61) after the F5 eval; no other profile inherits it, so withdrawing models.pre_screen disables only the pre-screen
  AUTO_RELEASE_ENABLE:
    requires:
    - F6_STEP2
    - FE_RELEASE
    description: Narrow auto-release; requires a new owner Q amending Q11
