qualified_fact_rule:
  decision_status: P-19
  to_status_ids_ref: pipelines.<pipeline>.qualified_status_ids
  allowed_actor_user_ids: []          # call-center users approved by sales_lead
  required_evidence_field_ids: []     # optional, approved by sales_lead
