  capability_rule: capability_services keys equal every execution-policy capability_requires_profile key, including
    transition capabilities; unknown capability or missing dependency is refused, and every enabled/previously active
    capability keeps its service closure until explicitly disabled by its existing authorized path; capability profile
    gates remain mandatory
  ack_rule: deployment.required_acks must equal exactly the deployment.services entries whose runtime-isolation
    ack_class is write_gate or function_gate; no missing, extra, duplicate, unknown or caller-selected class; both
    full ACK catalogues stay unchanged
  gate_rule: prepare and activate recompute phase floors, capability dependencies and required_acks from the trusted
    registries and current state; target_profile is informational and grants no service exemption; a none-ACK service
    still requires its registered health/version checks
  absence_rule: an absent future-phase service is not awaited only when it is outside the current phase floor, prior
    installed inventory and every enabled capability dependency; an installed protective service can never be omitted
    from ACKs
  ack_failure: on update retain the prior current release and close affected gates; on initial retain no current,
    hold admissions denied and retry only the exact pending candidate/approval/activation identity
initial_release:
  decision_ref: Q65
  scope: the first F1 AMT-host release only; not a rebuild, restore, kill resume, privileged general deployment
    or recurring offline approval path
  entrypoint: owner SSH through Tailscale runs a root-owned fixed installer and one-time bootstrap importer, pinned
    and reviewed by the owner before execution; no arbitrary repo script, shell argument or candidate-provided executable
    runs as root
  trust_root: the owner provisions /etc/amt/release-signers and verifies the fixed installer digest and main-reachable
    owner-signed annotated release tag; artifacts are built/tested once as amt-build, and the same digests are promoted
  required_absent:
  - current_symlink
  - active_release
  - prior_release_ledger
  - killed_latch
  - used_bootstrap
  initial_manifest:
    deployment_kind: initial
    phase: F1
    base_release_id: null
    capabilities_enabled: []
    readiness_snapshot_capabilities: {}
    release_class: normal
  approval_source: owner_ssh_signed_initial
  approval_envelope:
    canonicalization: canonical JSON without detached signature; exact digest and every nullable binding value are
      explicit
    required_fields:
    - bootstrap_id
    - host_identity
    - installer_digest
    - candidate_id
    - manifest_digest
    - main_commit
    - artifact_digests
    - owner_person_id
    - policy_revision
    - role_revision
    - control_epoch
    - nonce_hash
    - approved_at
    - expires_at
    - verification_id
    - verdict
    - evaluator_revision
    - proposal_revision
    signature: owner detached signature verified against /etc/amt/release-signers, bound to the seeded active owner
      person and host/bootstrap identity; a signature or tag alone is never a release approval
  seed_transaction: a one-shot fixed bootstrap function atomically writes typed_confirmations, release_approvals,
    append-only audit and the singleton bootstrap marker, binding one nonce, candidate, approval and activation
    identity; importer checks owner identity, role/policy revision, control epoch, expiry, manifest and all signature
    bindings; no persistent new runtime DB writer grant
  replay_rule: an exact replay returns the existing seed identities without another write; a different nonce, candidate,
    envelope or approval is refused once bootstrap is bound; after first ACK the marker is permanently sealed and
    even exact replay cannot activate another initial release
  publisher_rule: normal amt-release still requires the durable release_approvals row and owner-signed annotated
    release-* tag, checks signer/main reachability/exact commit and all ordinary manifest, role/policy, epoch and
    expiry guards; no tag-only release and no initial killed-latch exception
  startup:
    global_mode: shadow
    pipeline_modes:
      rent: L0_shadow
      sale: L0_shadow
    admission: denied
    capabilities_enabled: []
  activation_order: the fixed initializer writes the first control state only when no latch/state exists; candidate
    services validate/ACK the explicit staged immutable path with admissions denied; current is published only after
    the full effective ACK set matches; no fake ACK and no old release exists on first failure
  retry_rule: after interrupted/failed first ACK, use the same pending candidate, approval, nonce and activation
    identity with their original validity checks; no second seed, no implicit expiry extension, no different manifest;
    an invalid or irreparable initial attempt stops for an explicit owner recovery decision
  closeout: record the matching ACKs, publish current atomically, seal bootstrap and demonstrate normal Telegram
    /release approve with typed code for the next owner-signed update; initial publication enables no billable LLM,
    media, agent or ad/write capability
  later_updates: deployment.kind update, nonnull base_release_id equal to current active release, ordinary Telegram
    typed approval only; owner SSH recovery may restore a previously approved release under the existing recovery
    runbook, never mint a replacement initial approval
