  phase_floor: cumulative union from F1 through deployment.phase; a phase never falls below the active release phase
  services_rule: deployment.services is the complete installed/deployed runtime-isolation service_id inventory,
    including disabled and none-ACK services; compare against staged unit inventory and the prior active inventory,
    never a caller-selected enabled subset; existing services cannot silently disappear
