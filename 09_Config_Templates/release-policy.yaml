    - amt-verify
    - managed-runner
    - amt-control
    - amt-workflow
    - amt-release
    release.manifest:
    - amt-release
    - amt-verify
    - amt-workflow
    - amt-control
    - ops-bot
    release.auto:
    - amt-release
    - amt-verify
    - amt-workflow
    - amt-control
    - ops-bot
    review.pre_screen:
    - gateway
    - llm-proxy
    - quota-coordinator
    - cost-watchdog
    - amt-control
    - ops-bot
    write_mode.enabled:
    - tg-auth
    - ops-bot
    - gateway
    - executor
    - amt-control
    - amocrm-mcp
    - quota-coordinator
    - llm-proxy
    - capi-bridge
    - sync-worker
    - cost-watchdog
    - amt-workflow
    pipeline.rent.L1:
    - tg-auth
    - ops-bot
    - gateway
    - executor
    - amt-control
    - amocrm-mcp
    - quota-coordinator
    - llm-proxy
    - capi-bridge
    - sync-worker
