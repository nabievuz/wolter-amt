# Project OS configuration template; unresolved readiness blocks the relevant live profile.
schema_version: 1
bundle_state: template
decision_refs: [Q11, Q12, Q19, Q46.4, Q65]
runtime_root: /opt/wolter-amt
owner: root:root
source_branch: main
publisher: amt-release   # root-owned fixed entrypoint; no arbitrary repo scripts
publisher_egress:   # runtime-isolation.yaml#services amt-release; per-UID nftables cannot tell root services apart
  enforcement: systemd IPAddressDeny=any + IPAddressAllow=localhost and the GitHub ranges below, on amt-release.service
  github_ranges_source: GitHub meta API (the git and api address lists), recorded with its fetch date in infra/VERSIONS.lock.md; refreshed by the weekly dependency_check (WF-E03) and applied only through a release
config_publish: validate_prepare_activate_ack
artifact_identity: build_once_promote
merge_rule: fast_forward_or_rebase_with_tree_hash_equality; otherwise new manifest and re-verification
write_gate_acks: [gateway, executor, llm-proxy, ops-bot, amt-control, amocrm-mcp, quota-coordinator, amt-workflow]
function_gate_acks: [sync-worker, capi-bridge, cost-watchdog, tg-auth]
function_gate_behavior:
  sync-worker: jobs do not run until the new revision is acknowledged
  capi-bridge: outbox held until the new mapping is acknowledged
  cost-watchdog: previous thresholds stay active until acknowledged
  tg-auth: new sessions denied until acknowledged
version_fields:
- code_sha
- config_sha
- manifest_digest
- schema_version
- min_compatible_code
- max_compatible_code
- target_profile
- capabilities_enabled
- readiness_snapshot
- active_ack_at
- tool_schema_digest   # digest of schemas/tools/** - gateway guard 4 argument schemas
- prompt_digest   # per-role digest of the eager prompt built from prompt-manifest.yaml
release_approval:
  record: release_approvals
  required_from: F1
  applies_to: every AMT-host release - code, config (offers included), workflow definitions, knowledge and skills, secret-rotation renders and recovery releases
  candidate: amt-release prepare builds one candidate per merged main commit (candidate_id = first 12 hex characters of manifest_digest); the owner approves that exact candidate
  readiness_only_candidate: amt-release may build a candidate from the active release commit when only the readiness_snapshot changes (to pin newly approved bundle-bound readiness values); it follows the same approval, tag and activation path
  bound_to: [manifest_digest, verification_id, verdict, evaluator_revision, proposal_revision, policy_revision, role_revision, control_epoch]   # single list; evolution-policy references it
  nullable_before_fe_release: [verification_id, verdict, evaluator_revision, proposal_revision]
  nullable_without_upgrade_proposal: [proposal_revision]   # config, offer and secret-rotation releases
  created_by: owner via /release approve <candidate_id> (typed code), except the one-time Q65 owner SSH signed initial approval under initial_release
  human_gate: HG-REL-01
  tag_only_release: never
code_release_tags: release-*
tag_ruleset:
  create_update_delete: [owner]
  patterns: [release-*, F*-done]
  bypass: none
  signed_annotated_tag_required: true
  signer_keys_file: /etc/amt/release-signers
  commit_must_be_reachable_from: main
  tag_commit_must_equal_manifest_commit: true
engineering_push_scope: [cand/*]
builder_token_can_create_release_tags: false
production_tag_owner_required: true
root_publish_arbitrary_repo_scripts: false
build_install_test_as_unprivileged_user: amt-build
scope: AMT host only
out_of_scope:
  landing_and_umami: AMT opens a PR (WF-B04); owner merges and deploys in production Dokploy (Q46.4); AMT verifies the published snapshot read-only
  release_controller_holds_dokploy_or_landing_credentials: false
release_classes:
  normal: any owner-approved release; refused while global mode is killed
  recovery: owner-approved release whose manifest declares release_class recovery and only restores containment, reconciliation or a previously verified release; allowed while killed
kill_interaction: non-recovery releases refused while global mode is killed
maintenance_hold_ref: execution-policy.yaml#maintenance_hold
db_rollback: explicit_compatibility_forward_repair_or_restore
old_new_worker_parallel_writes: false
roles_reload: never_reseed_runtime_DB
deployment:
