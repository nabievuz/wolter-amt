    - executor
    - meta-ads-mcp
    - amt-control
    - quota-coordinator
    - ops-bot
    - amt-workflow
    agents.run:
    - hermes
    - managed-runner
    - gateway
    - llm-proxy
    - quota-coordinator
    - cost-watchdog
    - amt-control
    - ops-bot
    - amt-workflow
    - paperclip
    creative.publish:
