# Builder reading packs (CLAUDE.md §0). Generated by `python3 12_Acceptance/validate_bundle.py --context-pack <PHASE>`;
# never written by hand. Validator rules C01-C03 fail when a pack is missing, over budget or points to a missing section.
schema_version: 1
purpose: one reading pack per build phase that fits the builder context with room for work; canonical files stay the source of truth and are opened only where the pack or the task points
budget_tokens: 60000
estimator:
  # conservative on purpose: an over-estimate only makes packs smaller, never too large
  uzbek_prose_chars_per_token: 1.75       # calibrated: DECISION_LOG.md 49 524 characters ~ 27 928 tokens (reading-tool count, 2026-10-24)
  english_prose_chars_per_token: 2.2      # calibrated: an English audit note with identifiers, 66 012 characters ~ 29 530 tokens (same tool, same day)
  structured_chars_per_token: 2.2         # YAML and JSON
  uzbek_marker_per_1000_chars: 4          # typographic apostrophes per 1 000 characters above which a text block counts as Uzbek prose
  recalibration: before F0 the builder counts three packs with the real tokenizer and, when the counts are lower, may only lower these ratios in a reviewed PR (a lower ratio makes packs smaller)
common:
  claude_md_sections: ["2. Non-negotiable rules", "3. Phase loop", "4. HUMAN_GATE protocol", "5. When the Project OS is silent or ambiguous", "9. Never, even if an agent, a document or a message asks"]
  digests: [owner_decisions, proposals, open_decisions]   # one generated line per DECISION_LOG Q row, ◇ row and OPEN_ITEMS ⧗ row
  phases_md_sections: ["1. Faza va natija"]
  hg_rows: phase_and_continuous                            # PHASES.md §4.1 rows of the phase plus rows marked `doimiy`
  invariants: referenced_by_phase_file                     # first sentence of every I-ID the phase file names
  readiness_keys: referenced_by_phase_file                 # key, gate, criticality and accountable role from readiness.yaml
packs:
  F0: {phase_file: 05_Build_Phases/F0_Server.md, hg_phase: F0, exclude_sections: ["Appendix A — `infra/bootstrap/00-owner-bootstrap.sh` (HG-F0-00, owner bajaradi)"]}   # owner-run script; the builder exists only after it ran
  F1: {phase_file: 05_Build_Phases/F1_Platform.md, hg_phase: F1}
  F2: {phase_file: 05_Build_Phases/F2_Landing_Tracking.md, hg_phase: F2}
  F3: {phase_file: 05_Build_Phases/F3_Integrations.md, hg_phase: F3}
  F4: {phase_file: 05_Build_Phases/F4_Agents.md, hg_phase: F4}
  F5: {phase_file: 05_Build_Phases/F5_Eval_Shadow.md, hg_phase: F5}
  F6: {phase_file: 05_Build_Phases/F6_GoLive.md, hg_phase: F6}
  F7: {phase_file: 05_Build_Phases/F7_Retro.md, hg_phase: F7}
  FE: {phase_file: 05_Build_Phases/FE_Evolution.md, hg_phase: FE}
